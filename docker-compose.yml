services:
  flowforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowforge
    restart: unless-stopped
    ports:
      - "8812:8812"
    environment:
      PORT: "8812"
      NODE_ENV: production
      # 시각화 대상 openspec 루트(컨테이너 내부 경로). 아래 볼륨으로 호스트 openspec/ 마운트.
      OPENSPEC_ROOT: /data/openspec
      # 상주(docs) 모드 스캔 루트. 아래 볼륨으로 호스트 /home/gaegul 을 RO 마운트.
      # 스캔은 <DOCS_ROOT>/<project>/docs/{user-flow.md|PRD.md} 1단계만, 읽는 파일은
      # 하드코딩(user-flow.md/PRD.md/wireframe.html)뿐 → 홈 노출은 RO(쓰기 불가)로 제한.
      DOCS_ROOT: /data/docs-root
      # 계층 대시보드(hierarchical-project-dashboard) 카드그리드 스캔 루트.
      # docs-root와 동일한 호스트 홈 RO 마운트를 재사용 — <project>/openspec/changes/*/specs/
      # 가진 프로젝트를 카드로 노출(읽기전용 스캔이라 RW 불필요).
      PROJECTS_ROOT: /data/docs-root
      # 와이어 피드백/승인분 전용 RW 볼륨(planning-wireframe-generation-feedback, B안).
      # 홈은 RO라 docsDir 하위 write 불가(EROFS) → feedback.json·wireframe.json은 이 RW 볼륨에.
      # flowforge write 경로: <WIREFRAME_FEEDBACK_ROOT>/<project>.feedback.json / .wireframe.json
      WIREFRAME_FEEDBACK_ROOT: /data/wireframe-feedback
      # 크로스프로젝트 change 레이아웃 오버레이 전용 RW 볼륨(cross-project-layout-persistence).
      # PROJECTS_ROOT(호스트 홈)는 RO라 <project>/openspec/changes/<id>/viz/ write 불가(EROFS/ENOENT)
      # → 타 프로젝트 change 레이아웃은 이 RW 볼륨에. WIREFRAME_FEEDBACK_ROOT와 동일한 RO-홈 회피 패턴.
      # flowforge write 경로: <OVERLAY_ROOT>/<project>/<changeId>.json
      OVERLAY_ROOT: /data/graph-overlay
      # 쓰기 인증(public-surface-hardening). 값은 호스트 .env(git-ignored)에서 주입 —
      # 실값을 이 파일에 커밋하지 않는다(30-security). 넷 다 미설정이면 현행 무인증 동작
      # (개발 모드) — 프로덕션 강제는 CF Zero Trust 등록 + 아래 env 주입을 한 세트로.
      # 절차: docs/EDGE_AUTH.md.
      FLOWFORGE_CF_ACCESS_AUD: ${FLOWFORGE_CF_ACCESS_AUD:-}
      FLOWFORGE_CF_ACCESS_TEAM_DOMAIN: ${FLOWFORGE_CF_ACCESS_TEAM_DOMAIN:-}
      FLOWFORGE_WRITE_TOKEN: ${FLOWFORGE_WRITE_TOKEN:-}
      FLOWFORGE_CORS_ORIGIN: ${FLOWFORGE_CORS_ORIGIN:-}
      # openspec-audit 큐(planning-audit-trigger). 컨테이너는 loopback으로 호스트 큐에 못 닿아
      # 도커 브리지 게이트웨이(172.18.0.1:8810, OPENSPEC_BIND=0.0.0.0)로 POST한다. env override 가능.
      OPENSPEC_QUEUE_URL: ${OPENSPEC_QUEUE_URL:-http://172.18.0.1:8810/api/tasks}
      # 큐 서비스 토큰(Bearer). 큐 server.py의 OPENSPEC_CONSOLE_TOKEN과 동일값이어야 audit enqueue 통과.
      # 실값은 호스트 .env(git-ignored)에서 주입 — 이 파일에 커밋하지 않는다(30-security).
      OPENSPEC_CONSOLE_TOKEN: ${OPENSPEC_CONSOLE_TOKEN:-}
    volumes:
      # 시각화 대상 = wowa-app openspec(change 6개, 데모 풍부). spec.md=읽기, viz/graph-overlay.json=쓰기라 RW.
      # wowa .gitignore에 openspec/**/viz/ 추가해 시각화 산출물 git 오염 차단함.
      # 도그푸딩(자체 openspec)으로 되돌리려면 ./openspec:/data/openspec 으로 교체.
      - /home/gaegul/wowa-app/openspec:/data/openspec
      # 상주 docs 스캔용 — 호스트 홈 전체 RO(읽기전용). docs/ 가진 프로젝트만 1단계로 잡힌다(ssoksok 등).
      - /home/gaegul:/data/docs-root:ro
      # 와이어 피드백/승인분 전용 RW(홈 RO 우회, B안). graph-overlay(/data/openspec)와 같은 전용 RW 볼륨 패턴.
      - /home/gaegul/flowforge/data/wireframe-feedback:/data/wireframe-feedback
      # 크로스프로젝트 change 레이아웃 오버레이 전용 RW(홈 RO 우회). PROJECTS_ROOT는 RO 유지(design D1 — 뒤집지 않는다).
      - /home/gaegul/flowforge/data/graph-overlay:/data/graph-overlay
    # immich 가 RAM 빠듯한 서버 → 메모리 상한으로 영향 차단(메모리 교훈: RAM 압박)
    mem_limit: 256m
    networks:
      - gaegul-infra

networks:
  gaegul-infra:
    external: true
    name: gaegul-infra_default
